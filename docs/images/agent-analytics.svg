<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" role="img" aria-labelledby="agent-report-title agent-report-description" style="width:100%; height:auto; display:block; border-radius:12px;">
          <title id="agent-report-title">Example Google Analytics report for an MCP server</title>
          <desc id="agent-report-description">Illustrative data: 1,284 requests split across reported agents Claude, ChatGPT and Cursor. Agent Analytics sends events to your own Google Analytics account.</desc>
          <defs>
            <linearGradient id="agent-report-background" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6d9f3"/><stop offset="1" stop-color="#66d9d3"/></linearGradient>
            <filter id="agent-report-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#33303f" flood-opacity=".15"/></filter>
          </defs>
          <rect width="800" height="472" rx="24" fill="url(#agent-report-background)"/>
          <rect x="44" y="34" width="712" height="404" rx="12" fill="#fff" filter="url(#agent-report-shadow)"/>
          <path d="M56 34H744Q756 34 756 46V100H44V46Q44 34 56 34Z" fill="#fafafa"/>
          <path d="M44 100H756" stroke="#ececf0"/>
          <g fill="#e99520"><rect x="72" y="61" width="10" height="22" rx="4"/><rect x="86" y="49" width="10" height="34" rx="4"/><circle cx="77" cy="52" r="5"/></g>
          <text x="112" y="77" fill="#33323b" font-family="'IBM Plex Sans',sans-serif" font-size="26" font-weight="600">Google Analytics</text>
          <rect x="518" y="49" width="210" height="36" rx="18" fill="#f1edf7"/>
          <text x="623" y="73" text-anchor="middle" fill="#655576" font-family="'IBM Plex Sans',sans-serif" font-size="22">Example report</text>
          <text x="76" y="145" fill="#24222d" font-family="'IBM Plex Sans',sans-serif" font-size="28" font-weight="600">MCP server activity</text>
          <text x="76" y="178" fill="#787580" font-family="'IBM Plex Sans',sans-serif" font-size="21">Requests by reported agent</text>
          <text x="720" y="145" text-anchor="end" fill="#24222d" font-family="'IBM Plex Sans',sans-serif" font-size="36" font-weight="600">1,284</text>
          <text x="720" y="174" text-anchor="end" fill="#787580" font-family="'IBM Plex Sans',sans-serif" font-size="20">requests</text>
          <g stroke="#f0eef4"><path d="M230 205V365M350 205V365M470 205V365M590 205V365"/></g>
          <g fill="#55515f" font-family="'IBM Plex Sans',sans-serif" font-size="23"><text x="76" y="236">Claude</text><text x="76" y="293">ChatGPT</text><text x="76" y="350">Cursor</text></g>
          <g fill="#7c3aed"><rect x="230" y="211" width="398" height="34" rx="5"/><rect x="230" y="268" width="259" height="34" rx="5"/><rect x="230" y="325" width="134" height="34" rx="5"/></g>
          <g fill="#55515f" font-family="'IBM Plex Mono',monospace" font-size="22" text-anchor="end"><text x="720" y="236">646</text><text x="720" y="293">420</text><text x="720" y="350">218</text></g>
          <text x="76" y="410" fill="#8a8492" font-family="'IBM Plex Sans',sans-serif" font-size="19">Illustrative data · Reports live in your Google Analytics</text>
        </svg>
